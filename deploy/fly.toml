# Fly.io app. Build on Fly's builders so a local Docker Desktop is not required:
#   fly deploy --remote-only --build-arg SKIP_BUILD_GEO=1
# Set secrets with `fly secrets set`, not in this file.

app = "stellog-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    SKIP_BUILD_GEO = "1"

[env]
  DISABLE_TELEMETRY = "1"
  STELLOG_DEMO_MODE = "1"
  HOSTNAME = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
