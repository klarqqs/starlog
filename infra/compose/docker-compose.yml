name: starlog
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STARLOG_DB_NAME: ${STARLOG_DB_NAME:-starlog}
      UMAMI_DB_NAME: ${UMAMI_DB_NAME:-umami}
      STARLOG_TENANT_PASSWORD: ${STARLOG_TENANT_PASSWORD}
      STARLOG_OPERATOR_PASSWORD: ${STARLOG_OPERATOR_PASSWORD}
      STARLOG_INGEST_PASSWORD: ${STARLOG_INGEST_PASSWORD}
      STARLOG_AUTH_PASSWORD: ${STARLOG_AUTH_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
      - ../db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${STARLOG_DB_NAME:-starlog}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # local only

  umami:
    image: ${UMAMI_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${UMAMI_DB_NAME:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3000}:3000"

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:4000}
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_DATABASE_URL: postgresql://starlog_auth:${STARLOG_AUTH_PASSWORD}@db:5432/${STARLOG_DB_NAME:-starlog}
      TENANT_DATABASE_URL: postgresql://starlog_tenant:${STARLOG_TENANT_PASSWORD}@db:5432/${STARLOG_DB_NAME:-starlog}
      OPERATOR_DATABASE_URL: postgresql://starlog_operator:${STARLOG_OPERATOR_PASSWORD}@db:5432/${STARLOG_DB_NAME:-starlog}
      INGEST_DATABASE_URL: postgresql://starlog_ingest:${STARLOG_INGEST_PASSWORD}@db:5432/${STARLOG_DB_NAME:-starlog}
      STELLAR_AUTH_SECRET: ${STELLAR_AUTH_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${STARLOG_DB_NAME:-starlog}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"   # Starlog landing page, /app, /operator, /collect

volumes:
  pgdata:
